# Contrato propuesto. No es configuración activa del mock.
version: 1
configuration:
  access: yaml
  sources: web
  readings: web
access:
  providers:
    github:
      enabled: true
      client_id_env: GALICIA_GITHUB_CLIENT_ID
      client_secret_env: GALICIA_GITHUB_CLIENT_SECRET
    google:
      enabled: true
      client_id_env: GALICIA_GOOGLE_CLIENT_ID
      client_secret_env: GALICIA_GOOGLE_CLIENT_SECRET
  local_credentials: true
  registration: social_only
  default_role: user
  admin_assignment: owner_only
  management_mfa: required
