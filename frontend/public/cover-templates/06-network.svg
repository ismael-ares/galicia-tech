<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1067" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Plantilla 6: Conexiones</title><desc id="desc">Plantilla editable. Sustituir los textos event-title, event-subtitle y event-date.</desc><defs><linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#40566c" stop-opacity="0"/><stop offset=".42" stop-color="#40566c"/></linearGradient></defs><rect width="360" height="320" rx="20" fill="#40566c"/><g fill="none" stroke="#b1cce3" stroke-width="1.8" opacity=".55"><path d="M85 45 170 20 280 65 325 150 215 172 130 125 85 45 215 172 280 65 170 20 130 125 325 150"/><circle cx="85" cy="45" r="5" fill="currentColor"/><circle cx="170" cy="20" r="8" fill="currentColor"/><circle cx="280" cy="65" r="5" fill="currentColor"/><circle cx="325" cy="150" r="8" fill="currentColor"/><circle cx="215" cy="172" r="5" fill="currentColor"/><circle cx="130" cy="125" r="8" fill="currentColor"/></g><rect y="155" width="360" height="165" fill="url(#veil)"/><g fill="#ffffff" font-family="Segoe UI,Arial,sans-serif"><text x="24" y="35" font-size="9" letter-spacing="2">GALICIA TECH</text><text id="event-title" x="24" y="230" text-anchor="start" font-size="30" font-weight="700">Título del evento</text><text id="event-subtitle" x="24" y="256" text-anchor="start" font-size="14">Comunidad · Localidad</text><text id="event-date" x="24" y="290" font-size="10" fill="#e0eaf4">Fecha del evento</text><text x="336" y="307" text-anchor="end" font-size="7" fill="#e0eaf4">Portada automática</text></g></svg>
