<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1067" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Plantilla 1: Órbitas</title><desc id="desc">Plantilla editable. Sustituir los textos event-title, event-subtitle y event-date.</desc><defs><linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#263c54" stop-opacity="0"/><stop offset=".42" stop-color="#263c54"/></linearGradient></defs><rect width="360" height="320" rx="20" fill="#263c54"/><g fill="none" stroke="#9cbddd" stroke-width="1.8" opacity=".55"><g transform="translate(245 105) rotate(-25)"><ellipse rx="35" ry="20"/><ellipse rx="57" ry="33"/><ellipse rx="79" ry="46"/><ellipse rx="101" ry="59"/><ellipse rx="123" ry="72"/></g></g><rect y="155" width="360" height="165" fill="url(#veil)"/><g fill="#f4f8ff" font-family="Segoe UI,Arial,sans-serif"><text x="24" y="35" font-size="9" letter-spacing="2">GALICIA TECH</text><text id="event-title" x="24" y="230" text-anchor="start" font-size="30" font-weight="700">Título del evento</text><text id="event-subtitle" x="24" y="256" text-anchor="start" font-size="14">Comunidad · Localidad</text><text id="event-date" x="24" y="290" font-size="10" fill="#d2e0ef">Fecha del evento</text><text x="336" y="307" text-anchor="end" font-size="7" fill="#d2e0ef">Portada automática</text></g></svg>
