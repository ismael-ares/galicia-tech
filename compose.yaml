name: galicia-tech-v1
x-python: &python
  image: galicia-tech-backend:0.1.0
  build: ./backend
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  env_file: .env
  environment:
    POSTGRES_DB: galiciatech
    POSTGRES_USER: galiciatech
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./configuration:/app/configuration:ro
  networks: [app, storage]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    restart: unless-stopped
    environment:
      POSTGRES_DB: galiciatech
      POSTGRES_USER: galiciatech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env using tools/init_env.py}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U galiciatech -d galiciatech']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine@sha256:615b4cedaff0c1437a1548acae4222572df8c021eeb7382d64cb8b5e3a13ac7a
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis_data:/data]
    networks: [storage]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    <<: *python
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *python
    command: [python, manage.py, qcluster]
    healthcheck:
      test: [CMD, python, manage.py, check_worker]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    image: galicia-tech-frontend:0.1.0
    build: ./frontend
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [app]
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  gateway:
    image: nginx:stable-alpine@sha256:c59d1f8b1e0e42da75be973424cd72e23f7f8adfb54e982f4d1cd0216a5a5576
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports: ['${APP_BIND:-127.0.0.1}:${APP_PORT:-8088}:8080']
    volumes: ['./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [app]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/v1/health/']
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  app:
  storage:
    internal: true
volumes:
  postgres_data:
  redis_data:
