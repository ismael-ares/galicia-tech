    #galicia-agenda-mock .ga-button { display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 42px; padding: 9px 14px; border: 1px solid var(--ga-line); border-radius: 10px; color: var(--ga-ink); background: var(--ga-surface); font-weight: 500; }
    #galicia-agenda-mock .ga-button:hover { background: var(--ga-surface-2); }

    #galicia-agenda-mock .ga-button:disabled { cursor: not-allowed; opacity: .55; }
    #galicia-agenda-mock .ga-demo-note { margin: 14px 0 0; color: var(--ga-muted); font-size: .78rem; }
    #galicia-agenda-mock .ga-feedback { min-height: 1.5em; margin: 12px 0 0; color: var(--ga-green); font-size: .85rem; }
    #galicia-agenda-mock .ga-correction-form { display: grid; grid-template-columns: 1fr 1.3fr auto; align-items: end; gap: 10px; margin-top: 17px; padding: 15px; border-radius: 12px; background: var(--ga-surface-2); }
    #galicia-agenda-mock .ga-correction-form[hidden] { display: none; }
    #galicia-agenda-mock .ga-source-list { display: grid; gap: 10px; }
    #galicia-agenda-mock .ga-source-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 17px; box-shadow: none; }
    #galicia-agenda-mock .ga-source-primary { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
    #galicia-agenda-mock .ga-source-mark { display: grid; place-items: center; width: 36px; height: 36px; flex: 0 0 auto; border-radius: 11px; color: var(--ga-green); background: var(--ga-green-soft); }
    #galicia-agenda-mock .ga-source-name { display: block; font-weight: 500; }
    #galicia-agenda-mock .ga-source-url { display: block; max-width: 540px; overflow-wrap: anywhere; color: var(--ga-muted); font-size: .78rem; text-decoration: none; }
    #galicia-agenda-mock .ga-source-state { display: flex; align-items: center; gap: 7px; margin-top: 5px; color: var(--ga-muted); font-size: .76rem; }
    #galicia-agenda-mock .ga-source-state .ga-live-dot { width: 6px; height: 6px; box-shadow: none; }
    #galicia-agenda-mock .ga-source-state.is-paused { color: var(--ga-amber); }
    #galicia-agenda-mock .ga-source-actions { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
    #galicia-agenda-mock .ga-source-actions .ga-button { min-height: 38px; padding: 7px 10px; font-size: .8rem; }
    #galicia-agenda-mock .ga-source-form { max-width: 780px; margin-top: 26px; padding: 18px; border: 1px solid var(--ga-line); border-radius: var(--ga-radius); background: var(--ga-surface); }
    #galicia-agenda-mock .ga-source-form h3 { margin: 0 0 5px; font-size: 1rem; font-weight: 600; }

    #galicia-agenda-mock .ga-source-form-grid { display: grid; grid-template-columns: 1fr 1.25fr auto; align-items: end; gap: 10px; }
    #galicia-agenda-mock .ga-local-alert { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; color: var(--ga-amber); background: var(--ga-amber-soft); font-size: .82rem; }

    #galicia-agenda-mock .ga-app[data-layout=&quot;compact&quot;] .ga-hero { padding: 31px 0 22px; }
    #galicia-agenda-mock .ga-app[data-layout=&quot;compact&quot;] .ga-filters { margin-bottom: 19px; }

      #galicia-agenda-mock .ga-view-heading { align-items: flex-start; flex-direction: column; gap: 7px; }
      #galicia-agenda-mock .ga-event-card { padding: 16px; }
      #galicia-agenda-mock .ga-event-head { flex-direction: column; gap: 9px; }
      #galicia-agenda-mock .ga-badge { order: -1; }
      #galicia-agenda-mock .ga-facts { grid-template-columns: 1fr; gap: 10px; }
      #galicia-agenda-mock .ga-review-top { flex-direction: column; gap: 9px; }
      #galicia-agenda-mock .ga-review-meta { grid-template-columns: 1fr; gap: 10px; }
      #galicia-agenda-mock .ga-correction-form, #galicia-agenda-mock .ga-source-form-grid { grid-template-columns: 1fr; }
      #galicia-agenda-mock .ga-source-row { align-items: flex-start; flex-direction: column; gap: 12px; }
      #galicia-agenda-mock .ga-source-actions { width: 100%; justify-content: flex-end; }
      #galicia-agenda-mock .ga-source-url { max-width: 100%; }
      #galicia-agenda-mock .ga-compact-day { grid-template-columns: 1fr; gap: 8px; padding: 13px 0; }
      #galicia-agenda-mock .ga-compact-date { padding: 0; }
      #galicia-agenda-mock .ga-footer { flex-direction: column; gap: 6px; }
      #galicia-agenda-mock .ga-count { white-space: normal; }
    }
    @media (prefers-reduced-motion: reduce) { #galicia-agenda-mock * { scroll-behavior: auto !important; transition: none !important; } }
