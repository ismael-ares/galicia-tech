# Application policy. Secrets and deployment addresses belong in .env.
# Validate and restart backend + worker after changing this file.
version: 1
access:
  registration: false
  local_test_accounts: false
  require_admin_mfa: true
  social_providers: [google, github]
  session_idle_minutes: 30
  session_max_hours: 8
  auth_attempts: 30
  auth_window_seconds: 300
collection:
  enabled: false
  retrieval: daily
  weekdays: [0, 3] # Monday and Thursday for twice-weekly retrieval.
  min_interval_hours: 24
  scheduler_minutes: 60
  source_deadline_seconds: 65
  stale_run_minutes: 10
  max_details: 6
  max_events: 20
processing:
  frequency: twice-weekly
  budget_eur: 5.00
  paid_calls_enabled: false # LLM execution is not implemented in 0.1.
fetch:
  allowed_hosts: [gdg.community.dev, www.meetup.com, meetup.com, gpul.org, corunajug.org]
  max_bytes: 2000000
  max_redirects: 3
  connect_timeout_seconds: 5
  read_timeout_seconds: 8
profiles:
  local:
    access:
      registration: true
      local_test_accounts: true
      require_admin_mfa: false
sources:
  - id: coruna
    name: "GDG A Coruña"
    url: "https://gdg.community.dev/gdg-a-coruna/"
    city: "A Coruña"
    platform: "GDG"
