# Vista previa de la interfaz. No es el despliegue completo de seis servicios.
services:
  mock:
    build: .
    ports:
      - "127.0.0.1:8874:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
